name: Desktop build

# Every merge or push to main is released as a new version: the patch number of the last
# v* tag goes up by one (v0.2.0 → v0.2.1), and the macOS and Windows clients are published
# as a GitHub Release under that tag. To start a new minor or major version, raise "version"
# in package.json (e.g. to 0.3.0); the next release uses it as is.
# Pull requests into main are built too (as downloadable workflow artifacts) so packaging
# problems show up before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  # Superseded PR builds are cancelled; main builds queue so two releases never pick the same number.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: pick
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$RELEASE" != "true" ]; then
            # Pull request and manual builds keep package.json's version and publish nothing.
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          last=${last#v}
          newest=$(printf '%s\n%s\n' "$base" "$last" | sort -V | tail -n 1)
          if [ -z "$last" ] || { [ "$newest" = "$base" ] && [ "$base" != "$last" ]; }; then
            # No release yet, or package.json was raised past the last release.
            next=$base
          else
            IFS=. read -r major minor patch <<< "$last"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Last release: ${last:-none}; package.json: $base; releasing v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: --mac
          - name: Windows
            os: windows-latest
            platform: --win
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The version ends up in the installer names and in 关于 m-typora.
      - name: Set the version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run typecheck

      - name: Package
        run: npm run dist -- ${{ matrix.platform }}
        env:
          # No certificate: macOS builds get an ad-hoc signature (see electron-builder.yml),
          # which needs no secrets and is therefore safe on pull requests as well.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true

      - uses: actions/upload-artifact@v7
        with:
          name: m-typora-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          link() {
            local file
            file=$(cd dist && ls $1)
            echo "[$file](https://github.com/$GH_REPO/releases/download/$TAG/$file)"
          }
          cat > notes.md <<EOF
          | 系统 | 下载 |
          | --- | --- |
          | macOS（Apple 芯片） | $(link '*mac-arm64.dmg') |
          | macOS（Intel） | $(link '*mac-x64.dmg') |
          | Windows（64 位） | $(link '*win-x64-setup.exe') |

          安装包没有使用付费的开发者证书签名，首次打开时系统会拦截：

          - **macOS**：先打开一次，被拦截后到「系统设置 › 隐私与安全性」点「仍要打开」；或在终端运行 \`xattr -dr com.apple.quarantine /Applications/m-typora.app\`。
          - **Windows**：SmartScreen 提示时点「更多信息 › 仍要运行」。

          EOF
          # The changes since the previous release (merged pull requests) follow the table.
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "m-typora $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --latest
          # Builds used to replace a single "latest-main" pre-release; numbered releases supersede it.
          gh release delete latest-main --yes --cleanup-tag || true
