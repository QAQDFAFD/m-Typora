<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: http://localhost:*"
    />
    <title>m-typora</title>
  </head>
  <body>
    <header class="titlebar">
      <div class="title-wrap" id="title-wrap">
        <svg class="title-icon" viewBox="0 0 12 14" aria-hidden="true">
          <path d="M1.5.5h6l3 3v10h-9z" fill="#fff" stroke="currentColor" stroke-width=".8" />
          <text x="6" y="10.6" text-anchor="middle" font-size="3.6" font-weight="700" fill="currentColor">M↓</text>
        </svg>
        <span id="title" class="title-text" spellcheck="false">未命名</span>
        <span class="title-edited">— 已编辑</span>
        <button id="title-menu" class="title-chevron" aria-label="文件操作">
          <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" /></svg>
        </button>
      </div>
    </header>

    <div class="app">
      <aside id="sidebar" class="sidebar" aria-label="侧边栏"></aside>
      <div id="sidebar-resizer" class="sidebar-resizer" aria-hidden="true"></div>

      <section class="main">
        <div id="findbar" class="findbar" hidden></div>
        <main id="scroller" class="editor-scroll">
          <div id="write" class="write">
            <div id="front-matter" class="front-matter-host" hidden></div>
            <div id="wysiwyg" class="wysiwyg"></div>
          </div>
          <div id="source" class="source" hidden></div>
        </main>

        <footer id="footer" class="footer">
          <button id="toggle-sidebar" class="footer-button" title="显示 / 隐藏侧边栏 (⇧⌘L)" aria-label="显示或隐藏侧边栏">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" /><path d="M5.5 2.5v11" /></svg>
          </button>
          <button id="toggle-mode" class="footer-button" title="源代码模式 (⌘/)" aria-label="切换源代码模式">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4" /></svg>
          </button>
          <span class="spacer"></span>
          <button id="word-count" class="word-count" title="字数统计"></button>
        </footer>
        <div id="word-count-popover" class="word-count-popover" hidden></div>
      </section>
    </div>

    <div id="quick-open" class="overlay quick-open" hidden></div>
    <div id="preferences" class="overlay preferences" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
